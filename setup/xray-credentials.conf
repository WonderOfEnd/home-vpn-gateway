[Unit]
Wants=network-online.target
After=network-online.target

[Service]
User=home-vpn-xray
DynamicUser=yes
LoadCredential=gateway.json:/usr/local/etc/xray/config.json
Environment=XRAY_LOCATION_ASSET=/opt/home-vpn-gateway/xray
ExecStart=
ExecStart=/opt/home-vpn-gateway/xray/xray run -config %d/gateway.json
RestartPreventExitStatus=
RestartSec=5s
